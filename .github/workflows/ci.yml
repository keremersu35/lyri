name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # the pipeline targets Apple Silicon (mlx-whisper); tests themselves need no models
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q
