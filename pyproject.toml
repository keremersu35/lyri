[project]
name = "lyrics-timestamper"
version = "0.1.0"
description = "Word-level timestamped lyrics for any song, plus Brat-style lyric videos"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Kerem Ersu" }]
keywords = ["lyrics", "forced-alignment", "karaoke", "lrc", "whisper", "demucs", "brat"]
classifiers = [
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
]
requires-python = ">=3.12"
dependencies = [
    "demucs>=4.1.0",
    "fastapi>=0.141.1",
    "mlx-whisper>=0.4.3",
    "mutagen>=1.48.1",
    "numpy>=1.26.4",
    "pillow>=12.3.0",
    "python-multipart>=0.0.32",
    "requests>=2.34.2",
    "torch>=2.8",
    "transformers>=5.17.0",
    "uvicorn>=0.54.0",
]

[tool.uv]
environments = ["sys_platform == 'darwin' and platform_machine == 'arm64'"]

[project.scripts]
lts = "lts.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[tool.hatch.build.targets.wheel]
packages = ["lts"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
"lts/export.py" = ["E501"]  # ASS format declarations are single spec-mandated lines

[tool.pytest.ini_options]
testpaths = ["tests"]
